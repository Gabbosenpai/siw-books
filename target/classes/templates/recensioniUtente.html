<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Recensioni di [[${utente.nickname}]]</title>
    <link rel="stylesheet" href="/css/recensioniUtente.css" />
    <link rel="stylesheet" href="/css/navbar.css">
</head>
<body>

<header>
    <nav class="navbar">
        <div class="nav-links">
            <a href="/" title="Home">
                <img src="/images/Siw-Books-Cut-Logo.png" alt="logo" class="logo"/>
            </a>
            <a href="/libro">Books</a>
            <a href="/autore">Authors</a>
            <a href="/recensione">Reviews</a>
        </div>

         <div class="user-block" th:if="${userDetails}">
            <a class="username-pill" th:href="@{'/recensione/' + ${userDetails.username} + '/recensioni'}" th:text="${nickname}"></a>
            <a class="logout-link" href="/logout">Logout</a>
        </div>

        <div class="user-block" th:unless="${userDetails}">
            <a class="login-link" href="/login">Login</a>
        </div>
    </nav>
</header>

<h1 th:text="${utente.nickname} + '\'s Reviews'">nickname</h1>

<div th:if="${recensioni.isEmpty()}">
    <p>No reviews yet...</p>
</div>

<div th:unless="${recensioni.isEmpty()}">
    <table>
        <thead>
            <tr>
                <th>Book</th>
                <th>Title</th>
                <th>Text</th>
                <th>Rating</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="recensione : ${recensioni}">
                <td> 
                <a th:href="@{/libro/{id}(id=${recensione.libro.id})}" th:text="${recensione.libro.title}">Nome Libro</a>
                </td>
                <td th:text="${recensione.title}">Titolo</td>
                <td th:text="${recensione.text}">Descrizione</td>
                <td th:text="${recensione.rating + '/5'}">5</td>
            </tr>
        </tbody>
    </table>
</div>

</body>
</html>
